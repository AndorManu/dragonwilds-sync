name: release

# Tag a commit `vX.Y.Z` and this builds WorldSync.exe on a clean
# Windows runner and attaches it to the GitHub release, so the download
# is reproducible from source and never depends on anyone's laptop.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/generate_icon.py
      - run: python -m PyInstaller --noconfirm WorldSync.spec
      - name: Nexus Mods build (anonymous reports start off)
        run: |
          python tools/set_channel.py nexus
          $env:WORLDSYNC_EXE_NAME = "WorldSync-Nexus"
          python -m PyInstaller --noconfirm WorldSync.spec
          python tools/set_channel.py github
      - name: Print SHA-256 (compare against your download)
        run: |
          (Get-FileHash dist/WorldSync.exe -Algorithm SHA256).Hash
          (Get-FileHash dist/WorldSync-Nexus.exe -Algorithm SHA256).Hash
      - name: Create the release if the tag is new, then attach the exe
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          python tools/release_notes.py "$tag" > notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "WorldSync ${tag#v}" --notes-file notes.md
          gh release upload "$tag" dist/WorldSync.exe dist/WorldSync-Nexus.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
